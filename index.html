</section>
<section id="courseView" class="hidden">

<div class="course-grid"><button class="course-card" data-course="adult"><span>ADULT</span><strong>성인과정</strong><small>30번 듣고 · 말하고 · 교정하기</small></button><button class="course-card" data-course="teen"><span>STUDENT</span><strong>초·중·고 과정</strong><small>메인교재 · 단어 · 원서 · NVOCA</small></button></div>

</main>
