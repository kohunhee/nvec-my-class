<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NVEC ADMIN</title><link rel="stylesheet" href="../style.css?v=20261007-2218"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script></head><body><header><div class="brand"><img src="../67.JPG"><div><b>NVEC원어민어학원</b><span>ADMIN</span></div></div><button id="logoutBtn" class="ghost hidden">로그아웃</button></header><main><section id="login" class="panel login"><img class="login-logo" src="../67.JPG"><p class="eyebrow">NVEC원어민어학원</p><h1>ADMIN</h1><p class="muted">원장님 전용 종합관리</p><form id="form"><label>관리자 ID<input value="admin" disabled></label><label>비밀번호<input id="pw" type="password"></label><button class="primary">관리자 로그인</button></form><p id="msg" class="msg"></p></section><section id="recovery" class="panel login hidden"><img class="login-logo" src="../67.JPG"><p class="eyebrow">NVEC원어민어학원</p><h1>새 비밀번호 설정</h1><p class="muted">관리자 비밀번호를 새로 설정하세요.</p><form id="recoveryForm"><label>새 비밀번호<input id="newPw" type="password" minlength="8" required></label><label>비밀번호 확인<input id="newPw2" type="password" minlength="8" required></label><button class="primary">비밀번호 변경</button></form><p id="recoveryMsg" class="msg"></p></section><section id="dash" class="hidden admin-view"><div class="admin-head"><div><p class="eyebrow">NVEC ADMIN</p><h2>관리자 종합관리</h2><p class="muted">NVEC원어민어학원 회원 학습 현황</p></div><div class="admin-actions"><button id="addMember" class="admin-add">+ 회원 추가</button><button id="refresh" class="admin-refresh">새로고침</button></div></div><div class="admin-stats"><div><span>전체 회원</span><strong id="total">0</strong></div><div><span>오늘 학습</span><strong id="today">0</strong></div><div><span>오늘 미학습</span><strong id="miss">0</strong></div><div><span>3일 이상 미학습</span><strong id="old">0</strong></div></div><div class="admin-toolbar"><input id="search" placeholder="회원 ID 또는 이름 검색"><label class="admin-check"><input id="active" type="checkbox" checked> 활동회원만</label></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>회원 ID</th><th>이름</th><th>오늘 학습</th><th>최근 학습</th><th>녹음</th><th>상태</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div><div id="detail" class="member-detail hidden"></div></section></main><div id="memberModal" class="admin-modal hidden"><div class="admin-modal-card"><button id="modalClose" class="modal-x">×</button><p class="eyebrow">NVEC MEMBER</p><h3 id="modalTitle">회원 추가</h3><input id="editUserId" type="hidden"><label>회원 이름<input id="editName" autocomplete="off" placeholder="예: 김수아"></label><label>로그인 ID<input id="editMemberId" autocomplete="off" placeholder="예: jenny0714"></label><label>비밀번호<input id="editPassword" type="text" autocomplete="new-password" placeholder="비워두면 ID + $"></label><label id="activeLabel" class="admin-check hidden"><input id="editActive" type="checkbox" checked> 활동 회원</label><p class="muted small-note">신규 회원은 비밀번호를 비워두면 ‘회원ID$’로 자동 생성됩니다.</p><p id="memberMsg" class="msg"></p><div class="modal-actions"><button id="saveMember" class="primary">저장</button><button id="resetPassword" class="admin-refresh hidden">비밀번호 변경</button></div></div></div><footer>NVEC원어민어학원 · ADMIN</footer><script src="admin.js?v=20261007-2218"></script></body></html>
